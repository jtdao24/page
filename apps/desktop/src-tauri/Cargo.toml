[package]
name = "page-desktop"
version = "0.1.0"
description = "Page desktop application"
edition = "2024"
rust-version = "1.85"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which avoids a Windows build conflict: https://github.com/rust-lang/cargo/issues/8519
name = "page_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
