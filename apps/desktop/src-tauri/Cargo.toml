[package]
name = "page-desktop"
version = "0.1.0"
description = "Page desktop application"
edition = "2024"
rust-version = "1.85"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which avoids a Windows build conflict: https://github.com/rust-lang/cargo/issues/8519
name = "page_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Native folder picker for choosing a vault; the webview gets only the chosen path.
tauri-plugin-dialog = "=2.7.3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.190"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
