[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "page-core"
dynamic = ["version"]
description = "Local-first knowledge and context engine for Page."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143,<0.144",
    "pydantic>=2.14,<3",
    "uvicorn>=0.54,<0.55",
    "sentence-transformers>=5.7,<6",
    "faiss-cpu>=1.15,<2",
    "mcp>=2.3,<3",
    "certifi>=2024",
    "pypdf>=6.20,<7",
]

[dependency-groups]
dev = ["httpx>=0.28,<0.29", "pytest>=9.1"]

[tool.hatch.version]
path = "src/page_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/page_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
# The pinned test client intentionally uses httpx, not Starlette's preferred httpx2.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
